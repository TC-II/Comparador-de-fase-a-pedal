<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector de fase XOR</title>
<style>
  :root {
    --bg: #1c1c21;
    --panel: #24242b;
    --fg: #e8e8ea;
    --muted: #8a8a94;
    --border: #444;
    --grid: rgba(255,255,255,0.07);
    --edge: rgba(255,255,255,0.18);
    --red: #ff5e48;
    --blue: #48aaf7;
    --v1: #5eab93;
    --v2: #f5a04a;
    --avg: #ff9cc8;
    --btn: #2e2e36;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f6;
    --panel: #ffffff;
    --fg: #1c1c21;
    --muted: #6b6b75;
    --border: #cfcfd6;
    --grid: rgba(0,0,0,0.08);
    --edge: rgba(0,0,0,0.22);
    --red: #e8472f;
    --blue: #1f8fe0;
    --v1: #3f8f77;
    --v2: #d97a1c;
    --avg: #e46a9e;
    --btn: #e3e4f2;
  }
  .topbar { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  button.icon { display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
    border: none; border-radius: 10px; background: var(--btn); color: var(--fg); }
  button.icon:hover { filter: brightness(1.1); }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--btn); }
  .seg button { display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
    border: none; border-radius: 8px; background: transparent; color: var(--muted); font-size: 20px; }
  .seg button.active { background: var(--panel); color: var(--fg); }
  :root[data-theme="light"] .moon, :root:not([data-theme="light"]) .sun { display: none; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, "Segoe UI", sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(300px, 1fr) 2fr; gap: 16px;
    height: 100vh; padding: 16px; }
  .left, .right { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #circ { width: 100%; flex: 1; min-height: 260px; }
  .right canvas { width: 100%; flex: 1; min-height: 120px; background: var(--panel); border-radius: 8px; }
  .right canvas.big { flex: 1.6; }
  .ctrl { background: var(--panel); border-radius: 8px; padding: 10px 12px; display: grid;
    grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 14px; }
  .ctrl .name { font-weight: 600; }
  .ctrl input[type=range] { width: 100%; }
  .ctrl input[type=number] { width: 70px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; }
  .v1 .name { color: var(--v1); } .v1 input[type=range] { accent-color: var(--v1); }
  .v2 .name { color: var(--v2); } .v2 input[type=range] { accent-color: var(--v2); }
  .track { display: flex; flex-direction: column; align-items: stretch; }
  button.turbo { align-self: flex-end; margin-top: 2px; padding: 2px 4px; border: none;
    background: none; color: var(--accent); line-height: 0; }
  button.turbo:disabled { opacity: 0.25; cursor: default; }
  button.turbo:not(:disabled):not(.on) { animation: pulse 0.9s ease-in-out infinite alternate; }
  button.turbo.on { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 6px; }
  .v1 { --accent: var(--v1); } .v2 { --accent: var(--v2); }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.18); } }
  .val { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
  .buttons { display: flex; gap: 8px; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; font-size: 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; height: auto; }
    .right canvas { flex: none; height: 140px; }
    .right canvas.big { height: 200px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="topbar">
      <button id="theme" class="icon" title="Cambiar tema" aria-label="Cambiar tema">
        <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <div class="seg" role="group" aria-label="Modo de la rueda">
        <button data-mode="vector" title="Vectorial" aria-label="Vectorial">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </button>
        <button data-mode="car" title="Autito" aria-label="Autito">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>
          </svg>
        </button>
      </div>
    </div>

    <canvas id="circ"></canvas>

    <div class="ctrl v1">
      <span class="name">x₁</span>
      <div class="track">
        <input type="range" id="rpm1" min="5" max="15" step="0.1" value="12">
        <button class="turbo" id="turbo1" title="Turbo: escala ×10" aria-label="Turbo: escala ×10" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 16a3 3 0 0 1 2.24 5"/><path d="M18 12h.01"/>
            <path d="M18 21h-8a4 4 0 0 1-4-4 7 7 0 0 1 7-7h.2L9.6 6.4a1 1 0 1 1 2.8-2.8L15.8 7h.2c3.3 0 6 2.7 6 6v1a2 2 0 0 1-2 2h-1a3 3 0 0 0-3 3"/>
            <path d="M20 8.54V4a2 2 0 1 0-4 0v3"/><path d="M7.612 12.524a3 3 0 1 0-1.6 4.3"/>
          </svg>
        </button>
      </div>
      <span class="val" id="rpm1v"></span>
      <span>α₁ [°]</span>
      <input type="number" id="a1" value="0" step="5">
    </div>

    <div class="ctrl v2">
      <span class="name">x₂</span>
      <div class="track">
        <input type="range" id="rpm2" min="5" max="15" step="0.1" value="12.2">
        <button class="turbo" id="turbo2" title="Turbo: escala ×10" aria-label="Turbo: escala ×10" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 16a3 3 0 0 1 2.24 5"/><path d="M18 12h.01"/>
            <path d="M18 21h-8a4 4 0 0 1-4-4 7 7 0 0 1 7-7h.2L9.6 6.4a1 1 0 1 1 2.8-2.8L15.8 7h.2c3.3 0 6 2.7 6 6v1a2 2 0 0 1-2 2h-1a3 3 0 0 0-3 3"/>
            <path d="M20 8.54V4a2 2 0 1 0-4 0v3"/><path d="M7.612 12.524a3 3 0 1 0-1.6 4.3"/>
          </svg>
        </button>
      </div>
      <span class="val" id="rpm2v"></span>
      <span>α₂ [°]</span>
      <input type="number" id="a2" value="5" step="5">
    </div>

    <div class="buttons">
      <button id="pause">Pausa</button>
      <button id="reset">Reiniciar</button>
    </div>
  </div>

  <div class="right">
    <canvas id="p1"></canvas>
    <canvas id="p2"></canvas>
    <canvas id="p3" class="big"></canvas>
  </div>
</div>

<script>
const C = {};
function readColors() {
  const css = getComputedStyle(document.documentElement);
  for (const k of ['red', 'blue', 'v1', 'v2', 'avg', 'fg', 'muted', 'grid', 'edge'])
    C[k] = css.getPropertyValue('--' + k).trim();
}

const LW = 3;              // grosor común: casquetes, vectores y trazas

// ---- Simulación ----
const FS = 500;            // muestras por segundo
const DT = 1 / FS;
const T_NORMAL = 50, T_TURBO = 20;   // segundos visibles, sin y con turbo
let T_WIN = T_NORMAL;
const RPM_MIN = 5;
const L = FS * (Math.max(T_NORMAL, 2 * 60 / RPM_MIN) + 1);   // largo de los buffers: alcanza para lo visible y para la ventana de media más larga

const buf1 = new Uint8Array(L), buf2 = new Uint8Array(L), bufX = new Uint8Array(L);
const bufA = new Float32Array(L);
let head = 0, count = 0;   // head = próxima posición a escribir
let th1, th2, avgSum, avgN;
let paused = false;

const $ = id => document.getElementById(id);
const rad = d => d * Math.PI / 180;

let a1Prev = +$('a1').value, a2Prev = +$('a2').value;

function reset() {
  head = 0; count = 0; avgSum = 0;
  th1 = rad(+$('a1').value);
  th2 = rad(+$('a2').value);
  a1Prev = +$('a1').value; a2Prev = +$('a2').value;
  avgN = windowSamples();
}

// Media lenta: ventana = 2 períodos de la señal más lenta
const windowSec = () => 2 * 60 / Math.min(+$('rpm1').value, +$('rpm2').value);
const windowSamples = () => Math.round(windowSec() * FS);

const bit = th => (Math.sin(th) >= 0 ? 1 : 0);   // 1 = mitad superior (roja)
const at = k => (head - 1 - k + L) % L;            // k muestras atrás

function step() {
  const w1 = 2 * Math.PI * +$('rpm1').value / 60;
  const w2 = 2 * Math.PI * +$('rpm2').value / 60;
  th1 = (th1 + w1 * DT) % (2 * Math.PI);
  th2 = (th2 + w2 * DT) % (2 * Math.PI);
  const b1 = bit(th1), b2 = bit(th2), x = b1 ^ b2;

  // media móvil: suma corrida sobre las últimas avgN muestras de la XOR
  if (count >= avgN) avgSum -= bufX[at(avgN - 1)];
  avgSum += x;

  buf1[head] = b1; buf2[head] = b2; bufX[head] = x;
  head = (head + 1) % L;
  if (count < L) count++;
  bufA[at(0)] = avgSum / Math.min(count, avgN);
}

function setWindow() {
  avgN = windowSamples();
  avgSum = 0;
  for (let k = 0; k < Math.min(avgN, count); k++) avgSum += bufX[at(k)];
}

// ---- Dibujo ----
function fit(cv) {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, r.width, r.height];
}

function arrow(ctx, x0, y0, x1, y1, color, lw) {
  const a = Math.atan2(y1 - y0, x1 - x0), hl = 14;
  ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x0, y0);
  ctx.lineTo(x1 - hl * 0.8 * Math.cos(a), y1 - hl * 0.8 * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - hl * Math.cos(a - 0.4), y1 - hl * Math.sin(a - 0.4));
  ctx.lineTo(x1 - hl * Math.cos(a + 0.4), y1 - hl * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill();
}

// Autito visto desde arriba, apuntando hacia +x
function car(ctx, x, y, ang, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang); ctx.scale(1.4, 1.4);
  ctx.fillStyle = '#111';
  for (const [wx, wy] of [[-8, -7], [6, -7], [-8, 5], [6, 5]]) ctx.fillRect(wx, wy, 6, 2.5);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-13, -6, 26, 12, 4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(-5, -4.5, 9, 9, 2); ctx.fill();   // techo / parabrisas
  ctx.fillStyle = '#ffe680';
  ctx.fillRect(11, -5, 2, 2.5); ctx.fillRect(11, 2.5, 2, 2.5);    // faros
  ctx.restore();
}

function drawCircle() {
  const [ctx, w, h] = fit($('circ'));
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const lane = 14;                      // distancia de cada carril a la línea central
  const R = Math.min(w, h) / 2 - (mode === 'car' ? 2 * lane + 22 : 24);

  if (mode !== 'car') {   // ejes solo en modo vectorial
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - R - 18, cy); ctx.lineTo(cx + R + 18, cy);
    ctx.moveTo(cx, cy - R - 18); ctx.lineTo(cx, cy + R + 18);
    ctx.stroke();
  }

  if (mode === 'car') {
    // pista: asfalto entre dos círculos concéntricos
    const ro = R + 2 * lane, ri = R - 2 * lane;
    ctx.fillStyle = C.grid;
    ctx.beginPath(); ctx.arc(cx, cy, ro, 0, 2 * Math.PI); ctx.arc(cx, cy, ri, 0, 2 * Math.PI, true); ctx.fill();
    ctx.strokeStyle = C.muted; ctx.lineWidth = LW;
    ctx.beginPath(); ctx.arc(cx, cy, ro, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, ri, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([12, 10]);   // línea central intermitente
  }
  ctx.lineWidth = LW;
  ctx.strokeStyle = C.red;  ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, 2 * Math.PI); ctx.stroke();
  ctx.strokeStyle = C.blue; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI); ctx.stroke();
  ctx.setLineDash([]);

  if (mode === 'car') {
    // dos carriles: x₁ por afuera, x₂ por adentro; avanzan en sentido antihorario
    car(ctx, cx + (R + lane) * Math.cos(th1), cy - (R + lane) * Math.sin(th1), -th1 - Math.PI / 2, C.v1);
    car(ctx, cx + (R - lane) * Math.cos(th2), cy - (R - lane) * Math.sin(th2), -th2 - Math.PI / 2, C.v2);
  } else {
    const Rt = R - LW / 2;   // la punta toca el borde interno del círculo
    arrow(ctx, cx, cy, cx + Rt * Math.cos(th2), cy - Rt * Math.sin(th2), C.v2, LW);
    arrow(ctx, cx, cy, cx + Rt * Math.cos(th1), cy - Rt * Math.sin(th1), C.v1, LW);
    ctx.fillStyle = C.fg; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2 * Math.PI); ctx.fill();
  }
}

const PAD = { l: 44, r: 12, t: 26, b: 22 };

function frame(ctx, w, h, title, titleColors) {
  ctx.clearRect(0, 0, w, h);
  const pw = w - PAD.l - PAD.r, ph = h - PAD.t - PAD.b;
  const y = v => PAD.t + ph * (1 - (0.1 + 0.8 * v));
  const x = s => PAD.l + pw * (1 + s / T_WIN);   // s en [-T_WIN, 0]

  ctx.font = '11px system-ui, sans-serif';
  ctx.lineWidth = 1;
  ctx.strokeStyle = C.grid;
  ctx.fillStyle = C.muted;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let s = -T_WIN; s <= 0; s += T_WIN / 10) {
    ctx.beginPath(); ctx.moveTo(x(s), PAD.t); ctx.lineTo(x(s), PAD.t + ph); ctx.stroke();
    ctx.fillText(s + ' s', x(s), PAD.t + ph + 5);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const v of [0, 1]) {
    ctx.beginPath(); ctx.moveTo(PAD.l, y(v)); ctx.lineTo(PAD.l + pw, y(v)); ctx.stroke();
    ctx.fillText(v, PAD.l - 8, y(v));
  }

  ctx.font = '600 14px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let tx = PAD.l;
  title.forEach((t, i) => { ctx.fillStyle = titleColors[i]; ctx.fillText(t, tx, 18); tx += ctx.measureText(t).width; });

  ctx.save();
  ctx.beginPath(); ctx.rect(PAD.l, PAD.t, pw, ph); ctx.clip();
  return { x, y };
}

// Recorre el buffer en tramos de valor constante (más vieja → más nueva)
function runs(buf, cb) {
  const n = Math.min(count, FS * T_WIN);
  if (!n) return;
  let start = n - 1, val = buf[at(start)];
  for (let k = n - 2; k >= -1; k--) {
    const v = k >= 0 ? buf[at(k)] : -1;
    if (v !== val) { cb(-(start + 1) * DT, -(k + 1) * DT, val); start = k; val = v; }
  }
}

function drawBits(cv, buf, label, labelColor) {
  const [ctx, w, h] = fit(cv);
  const { x, y } = frame(ctx, w, h, [label], [labelColor]);
  ctx.lineWidth = 1; ctx.strokeStyle = C.edge;
  let prev = null;
  runs(buf, (s0, s1, v) => {
    if (prev !== null) { ctx.beginPath(); ctx.moveTo(x(s0), y(prev)); ctx.lineTo(x(s0), y(v)); ctx.stroke(); }
    prev = v;
  });
  ctx.lineWidth = LW;
  runs(buf, (s0, s1, v) => {
    ctx.strokeStyle = v ? C.red : C.blue;
    ctx.beginPath(); ctx.moveTo(x(s0), y(v)); ctx.lineTo(x(s1), y(v)); ctx.stroke();
  });
  ctx.restore();
}

function drawXor() {
  const [ctx, w, h] = fit($('p3'));
  const { x, y } = frame(ctx, w, h, ['x₁ ', '⊕', ' x₂', '   media móvil'], [C.v1, C.fg, C.v2, C.avg]);

  // flancos finos, como en x₁ y x₂
  ctx.strokeStyle = C.edge; ctx.lineWidth = 1;
  ctx.beginPath();
  let prev = null;
  runs(bufX, (s0, s1, v) => {
    if (prev !== null) { ctx.moveTo(x(s0), y(prev)); ctx.lineTo(x(s0), y(v)); }
    prev = v;
  });
  ctx.stroke();

  ctx.strokeStyle = C.fg; ctx.lineWidth = LW;
  ctx.beginPath();
  runs(bufX, (s0, s1, v) => { ctx.moveTo(x(s0), y(v)); ctx.lineTo(x(s1), y(v)); });
  ctx.stroke();

  if (count) {
    ctx.strokeStyle = C.avg; ctx.lineWidth = LW;
    ctx.beginPath();
    const n = Math.min(count, FS * T_WIN);
    const stride = Math.max(1, Math.floor(n / (w * 2)));
    for (let k = n - 1; k >= 0; k -= stride) {
      const px = x(-k * DT), py = y(bufA[at(k)]);
      k === n - 1 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.lineTo(x(0), y(bufA[at(0)]));
    ctx.stroke();
  }
  ctx.restore();
}

// ---- Loop ----
let last = performance.now(), acc = 0;
function loop(now) {
  let dt = Math.min((now - last) / 1000, 0.25);
  last = now;
  if (!paused) {
    acc += dt;
    while (acc >= DT) { step(); acc -= DT; }
  }
  drawCircle();
  drawBits($('p1'), buf1, 'x₁', C.v1);
  drawBits($('p2'), buf2, 'x₂', C.v2);
  drawXor();
  requestAnimationFrame(loop);
}

// ---- Controles ----
function labels() {
  $('rpm1v').textContent = (+$('rpm1').value).toFixed(1) + ' rpm';
  $('rpm2v').textContent = (+$('rpm2').value).toFixed(1) + ' rpm';
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  readColors();
  try { localStorage.setItem('theme', t); } catch (e) {}
}
$('theme').addEventListener('click', () =>
  setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
let mode = 'vector';
function setMode(m) {
  mode = m;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  try { localStorage.setItem('mode', m); } catch (e) {}
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
let savedMode = null;
try { savedMode = localStorage.getItem('mode'); } catch (e) {}
setMode(['vector', 'car'].includes(savedMode) ? savedMode : 'vector');

let savedTheme = null;
try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
setTheme(savedTheme === 'light' ? 'light' : 'dark');
// Turbo: con el cursor al máximo, la liebre multiplica la escala ×10 y deja el cursor al nuevo máximo.
// Con el turbo puesto, otro clic vuelve a la escala normal.
const BASE_MAX = 15;
function turboState() {
  for (const i of [1, 2]) {
    const r = $('rpm' + i), t = $('turbo' + i);
    const on = +r.max > BASE_MAX;
    t.classList.toggle('on', on);
    t.disabled = !on && +r.value < +r.max;
    t.title = t.ariaLabel = on ? 'Volver a escala normal' : 'Turbo: escala ×10';
  }
  // con algún turbo puesto, la escala temporal se achica
  T_WIN = +$('rpm1').max > BASE_MAX || +$('rpm2').max > BASE_MAX ? T_TURBO : T_NORMAL;
}
for (const i of [1, 2]) {
  $('turbo' + i).addEventListener('click', () => {
    const r = $('rpm' + i);
    if (+r.max > BASE_MAX) { r.max = BASE_MAX; r.value = Math.min(+r.value, BASE_MAX); }
    else { r.max = BASE_MAX * 10; r.value = r.max; }
    labels(); setWindow(); turboState();
  });
}
['rpm1', 'rpm2'].forEach(id => $(id).addEventListener('input', () => { labels(); setWindow(); turboState(); }));
$('a1').addEventListener('input', () => { const a = +$('a1').value; th1 += rad(a - a1Prev); a1Prev = a; });
$('a2').addEventListener('input', () => { const a = +$('a2').value; th2 += rad(a - a2Prev); a2Prev = a; });
$('pause').addEventListener('click', () => {
  paused = !paused; $('pause').textContent = paused ? 'Seguir' : 'Pausa';
});
$('reset').addEventListener('click', reset);

labels();
turboState();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
